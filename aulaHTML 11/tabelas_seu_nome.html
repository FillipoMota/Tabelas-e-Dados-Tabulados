<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Tabela de Sorvetes</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; }
    table { border-collapse: collapse; }
    th, td { border: 1px solid #999; padding: 8px 14px; }
    th { background-color: hotpink; color: white; }
    tr:nth-child(even) { background-color: #ffeaf3; }
    td:nth-child(1) { text-align: center; }
    td:nth-child(3) { font-weight: bold; }
    img { width: 40px; }
  </style>
</head>
<body>

  <h2>Atividade: Tabelas</h2>
  <p>Aluno: Seu Nome</p>
  <p>Disciplina: Desenvolvimento Web</p>
  <p>Data: 18/11/2026</p>
  <hr>

  <h3>Preços dos Sorvetes</h3>

  <table>
    <tr>

      <th>Sabor</th>
      <th>Preço</th>
    </tr>
    <tr>
      <td><img src="imagens/sorvete1.png" alt="Morango"></td>
      <td>Morango</td>
      <td>R$ 6,00</td>
    </tr>
    <tr>
      <td><img src="imagens/sorvete2.png" alt="Chocolate"></td>

    <tr>
      <td><img src="imagens/sorvete3.png" alt="Baunilha"></td>

    <tr>

    <tr>
      <td><img src="imagens/sorvete7.png" alt="Doce de leite"></td>

  </table>

</body>
</html>
